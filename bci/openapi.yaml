openapi: 3.0.3

info:
  title: API de simulação — Capital Decrescente (Consumo) BCI
  version: "1.0.0"
  description: |
    Simulação do prémio do seguro de vida associado a crédito ao consumo com
    capital decrescente, e consulta da tabela de tarifas.

    A app não persiste nada: cada pedido é calculado e devolvido.

    ## Regras de cálculo

    | Item | Regra |
    |---|---|
    | Idade | Idade no aniversário mais próximo, à data da simulação |
    | Taxa (‰) | Tabela por perfil × idade (18–70) × prazo (1–7) |
    | Prémio total | `montante × taxa / 1000 × (1 + agravamento)` |
    | Prémio simples | `prémio total / 1,025` |
    | Sobretaxa | 1,5 % do prémio simples |
    | Selo | 1 % do prémio simples |
    | Comissão BCI | 21 % do prémio simples |

    A taxa da tarifa produz o prémio **total** (encargos já incluídos); o prémio
    simples obtém-se por divisão por 1,025 (= 1 + 1,5 % + 1 %). Confirma-se
    depois que `prémio total = prémio simples + sobretaxa + selo`.

    O agravamento é fixo, configurado em `settings.BCI_AGRAVAMENTO`
    (ex.: `0.10` = 10 %); não é um parâmetro do pedido.

    Fonte das regras e das taxas: `Capital Decrescente Consumo Formulas.xlsx`
    e `Capital Decrescente Tarifa BCI.xlsx`.

servers:
  - url: https://emose-serviops.com/api/bci
    description: Produção
  - url: http://127.0.0.1:8010/api/bci
    description: Desenvolvimento local

security:
  - TokenAuth: []

tags:
  - name: Processes
    description: Simulação e tarifa

paths:
  /processes/quotation:
    post:
      tags: [Processes]
      operationId: simularProcesso
      summary: Simula o prémio de um empréstimo
      description: |
        Calcula o prémio a partir do montante, do perfil do mutuário, da data de
        nascimento e do prazo. Nada é gravado.

        A idade é calculada à data do pedido, logo a mesma `data_nascimento`
        pode dar valores diferentes em datas diferentes.

        Atenção: a rota **não tem barra final**. `/processes/quotation/`
        devolve 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulacaoRequest"
            examples:
              trabalhador:
                summary: Trabalhador, 1.000.000 MZN a 5 anos
                value:
                  tipo_mutuario: TRABALHADORES
                  montante_emprestimo: 1000000
                  data_nascimento: "1996-01-01"
                  prazo_emprestimo: 5
              acentos_e_minusculas:
                summary: tipo_mutuario é normalizado
                value:
                  tipo_mutuario: Mutuários
                  montante_emprestimo: 500000
                  data_nascimento: "1985-07-20"
                  prazo_emprestimo: 3
      responses:
        "200":
          description: Simulação calculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulacaoResponse"
              example:
                montante_emprestimo: 1000000.0
                premio_total: 11843.99
                premio_simples: 11555.11
                sobre_taxa: 173.33
                selo: 115.55
                comissao_bci: 2426.57
                taxa: 11.84399
        "400":
          description: |
            Erro de validação (um objecto com uma lista de mensagens por campo),
            ou combinação não segurável (objecto com `detail`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErroValidacao"
                  - $ref: "#/components/schemas/ErroDetalhe"
              examples:
                validacao:
                  summary: Campos inválidos
                  value:
                    tipo_mutuario:
                      - "Valor inválido. Use um de: TRABALHADORES, MUTUARIOS, MILITARES."
                    montante_emprestimo:
                      - "Um número válido é necessário."
                    data_nascimento:
                      - "Formato inválido para data. Use um dos formatos a seguir: YYYY-MM-DD."
                    prazo_emprestimo:
                      - "Certifique-se de que este valor seja inferior ou igual a 7."
                nao_seguravel:
                  summary: Idade × prazo sem taxa na tarifa
                  value:
                    detail: "Não segurável: idade 67 com prazo de 7 anos (TRABALHADORES)."
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /processes/tarif:
    get:
      tags: [Processes]
      operationId: obterTarifa
      summary: Devolve a tabela de tarifas
      description: |
        Taxas em permilagem (‰) por idade (18–70) e prazo em anos (1–7).

        As combinações não seguráveis vêm a `null` em vez de omitidas, para a
        grelha ficar rectangular e poder ser renderizada como tabela
        directamente.

        Atenção: a rota **não tem barra final**. `/processes/tarif/` devolve 404.
      parameters:
        - name: tipo_mutuario
          in: query
          required: false
          description: |
            Perfil a devolver. Omitido, devolve os três.
            Aceita minúsculas e acentos (`Mutuários` → `MUTUARIOS`).
          schema:
            $ref: "#/components/schemas/TipoMutuario"
          example: TRABALHADORES
      responses:
        "200":
          description: Tabela de tarifas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TarifaResponse"
              example:
                tipos_mutuario: [TRABALHADORES]
                idade_min: 18
                idade_max: 70
                prazos: [1, 2, 3, 4, 5, 6, 7]
                tarifas:
                  - tipo_mutuario: TRABALHADORES
                    idade: 18
                    taxas:
                      "1": 3.685402
                      "2": 7.114062
                      "3": 10.259172
                      "4": 13.077362
                      "5": 15.622632
                      "6": 17.933739
                      "7": 20.045566
                  - tipo_mutuario: TRABALHADORES
                    idade: 67
                    taxas:
                      "1": 29.777084
                      "2": 59.806923
                      "3": 93.124529
                      "4": 130.097452
                      "5": 171.124289
                      "6": 216.64395
                      "7": null
        "400":
          description: "`tipo_mutuario` inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroDetalhe"
              example:
                detail: "tipo_mutuario inválido. Use um de: TRABALHADORES, MUTUARIOS, MILITARES."
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /processes/simulate-offline/:
    post:
      tags: [Processes]
      operationId: registarVendaOffline
      summary: Regista uma venda fechada ao balcão
      description: |
        **Stub.** Não valida o risco, não calcula prémio e não decide nada:
        guarda o pedido e responde sempre aprovado. Quem emite a apólice é o
        RPA INSIS, a jusante.

        A resposta é constante, tirando `id_bci`, que é devolvido tal como veio
        no pedido. Sem `id_bci` no pedido, vem string vazia.

        Qualquer corpo JSON é aceite, incluindo vazio. Não há campos
        obrigatórios, e valores fora dos limites da tarifa (por exemplo
        `prazo_emprestimo: 12`) não são rejeitados, porque não há cálculo.
        Tudo o que o canal enviar é guardado tal como veio.

        Quando o pedido traz `transaction_ref`, é idempotente: repetir não cria
        um segundo registo. A resposta é a mesma nos dois casos.

        A rota responde **com e sem** barra final.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistoOfflineRequest"
            example:
              id_bci: "EMOSETESTE0063"
              transaction_ref: "TRX-2026-000841"
              tipo_mutuario: "trabalhador"
