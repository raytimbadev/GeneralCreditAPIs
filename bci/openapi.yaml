              data_inicio_seguro: "2026-01-18"
              papel: "tomador"
              quota: 100
              estado: "activo"
              designacao: "Seguro Vida Credito Consumo"
              lingua_apolice: "Portugues"
              tipo_pagamento: "debito_conta"
              num_prestacoes: 1
              man_id: "6000035452"
