components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Token do Django REST Framework (`rest_framework.authtoken`).
        O valor do header inclui o prefixo `Token`:

        ```
        Authorization: Token c183b8795ebcb774bdc2491d28286bdcb3f4bec1
        ```

        Os tokens vivem na tabela `authtoken_token` da base de dados. Um token
        por utilizador. Emitir com
        `python manage.py drf_create_token <username>`.

  responses:
    NaoAutenticado:
      description: Header `Authorization` ausente ou token inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroDetalhe"
          example:
            detail: "As credenciais de autenticação não foram fornecidas."

  schemas:
    TipoMutuario:
      type: string
      description: |
        Perfil do mutuário, que determina a tabela de taxas a usar.
        Normalizado antes de ser validado: maiúsculas e minúsculas são
        equivalentes e os acentos são removidos.
      enum: [TRABALHADORES, MUTUARIOS, MILITARES]

    SimulacaoRequest:
      type: object
      required:
        [tipo_mutuario, montante_emprestimo, data_nascimento, prazo_emprestimo]
      properties:
        tipo_mutuario:
          $ref: "#/components/schemas/TipoMutuario"
        montante_emprestimo:
          type: number
          format: double
          description: Capital do empréstimo. Máximo 16 dígitos, 2 casas decimais.
          minimum: 0.01
          example: 1000000
        data_nascimento:
          type: string
          format: date
          description: |
            Só o formato `YYYY-MM-DD` é aceite. Tem de ser no passado, e a idade
            no aniversário mais próximo tem de cair entre 18 e 70 anos.
          example: "1996-01-01"
        prazo_emprestimo:
          type: integer
          description: Duração do empréstimo em anos.
          minimum: 1
          maximum: 7
          example: 5

    SimulacaoResponse:
      type: object
      required:
        [
          montante_emprestimo,
          premio_total,
          premio_simples,
          sobre_taxa,
          selo,
          comissao_bci,
          taxa,
        ]
      properties:
        montante_emprestimo:
          type: number
          format: double
          description: Eco do capital recebido no pedido.
        premio_total:
          type: number
          format: double
          description: >-
            `montante × taxa / 1000 × (1 + agravamento)`.
            Igual a prémio simples + sobretaxa + selo.
        premio_simples:
          type: number
          format: double
          description: "`prémio total / 1,025`."
        sobre_taxa:
          type: number
          format: double
          description: 1,5 % do prémio simples.
        selo:
          type: number
          format: double
          description: 1 % do prémio simples (imposto de selo).
        comissao_bci:
          type: number
          format: double
          description: 21 % do prémio simples. Não entra no prémio total.
        taxa:
          type: number
          format: double
          description: |
            Taxa da tarifa em permilagem (‰) usada no cálculo, para se poder
            conferir o resultado: `premio_total = montante × taxa / 1000`
            (com agravamento 0).

    TarifaResponse:
      type: object
      required: [tipos_mutuario, idade_min, idade_max, prazos, tarifas]
      properties:
        tipos_mutuario:
          type: array
          description: Perfis presentes em `tarifas`, pela ordem em que aparecem.
          items:
            $ref: "#/components/schemas/TipoMutuario"
        idade_min:
          type: integer
          example: 18
        idade_max:
          type: integer
          example: 70
        prazos:
          type: array
          description: Prazos que formam as colunas de `taxas`.
          items:
            type: integer
          example: [1, 2, 3, 4, 5, 6, 7]
        tarifas:
          type: array
          description: |
            Uma linha por perfil × idade: 53 linhas por perfil (idades 18 a 70),
            159 quando `tipo_mutuario` é omitido.
          items:
            $ref: "#/components/schemas/LinhaTarifa"

    LinhaTarifa:
      type: object
      required: [tipo_mutuario, idade, taxas]
      properties:
        tipo_mutuario:
          $ref: "#/components/schemas/TipoMutuario"
        idade:
          type: integer
          example: 18
        taxas:
          type: object
          description: |
            Taxa em ‰ por prazo. A chave é o prazo em anos, como string
            (`"1"` a `"7"`). O valor é `null` quando a combinação idade × prazo
            não é segurável.
          additionalProperties:
            type: number
            format: double
            nullable: true

    ErroDetalhe:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ErroValidacao:
      type: object
      description: |
        Uma entrada por campo inválido, com a lista de mensagens.

        As mensagens genéricas do Django REST Framework seguem o
        `LANGUAGE_CODE` do projecto, que em `config/settings.py` é `pt` — os
        exemplos são os dessa configuração. Noutra instalação com outro
        `LANGUAGE_CODE` o texto muda, pelo que os clientes devem decidir pela
        chave do campo e não pela mensagem. As mensagens escritas nesta app
        (perfil inválido, não segurável) estão sempre em português.
      additionalProperties:
        type: array
        items:
          type: string

    RegistoOfflineRequest:
      type: object
      description: |
        Objecto livre: nenhum campo é obrigatório e nenhum é validado. As
        propriedades abaixo são as 97 que o canal envia numa venda ao balcão.
        Cinco delas ficam em colunas próprias do registo — `id_bci`,
        `transaction_ref`, `premio_pago`, `comissao` e `certificado_apolice`;
        as restantes ficam no JSON `dados`, tal como vieram. Campos a mais são
        aceites e guardados na mesma.

        As respostas do questionário clínico chegam como texto (`Sim` / `Nao`,
        com e sem maiúsculas) e não são normalizadas. Os campos `sf_*` só vêm
        preenchidos quando `sexo` é `F`.
      additionalProperties: true
      properties:
        # --- Identificação do processo
        id_bci:
          type: string
          maxLength: 64
          description: "Identificador do processo no BCI. Único campo que influencia a resposta - é devolvido tal e qual. Guardado em coluna própria, truncado a 64 caracteres."
        transaction_ref:
          type: string
          maxLength: 100
          description: "Referência da transacção no sistema de origem. Coluna própria e chave de idempotência: repetir a mesma referência não cria um segundo registo."
        # --- Empréstimo (eco da cotação)
        tipo_mutuario:
          type: string
          description: "Perfil usado na cotação. Guardado tal como vem - aqui não é normalizado nem validado contra a lista."
        montante_emprestimo:
          type: number
          format: double
          description: "Capital do empréstimo."
        data_nascimento:
          type: string
          format: date
          description: "`YYYY-MM-DD`. Não é validada nem usada para calcular idade."
        prazo_emprestimo:
          type: integer
          description: "Prazo em anos. Valores fora de 1–7 passam, porque não há cálculo."
        agravamento:
          type: number
          format: double
          description: "Agravamento aplicado na cotação (`0.10` = 10 %)."
        # --- Cliente
        nuit:
          type: string
          description: "NUIT do cliente."
        nome_cliente:
          type: string
          description: "Nome próprio."
        apelido:
          type: string
          description: "Apelido."
        tipo_entidade:
          type: string
          description: "Natureza do tomador; `person` para pessoa singular."
        sexo:
          type: string
          description: "`M` ou `F`. Determina se o bloco `sf_*` vem preenchido."
        pais:
          type: string
          description: "País de residência."
        nacionalidade:
          type: string
          description: "Código ISO do país, `MZ`."
        lingua:
          type: string
          description: "Língua do cliente, `PORTUGUESE`."
        # --- Morada
        tipo_morada:
          type: string
          description: "`Casa`, `Trabalho`, etc."
        provincia:
          type: string
          description: "Província."
        regiao:
          type: string
          description: "Distrito ou distrito municipal."
        bairro:
          type: string
          description: "Bairro."
        morada:
          type: string
          description: "Avenida ou rua e número."
        # --- Contacto
        tipo_contacto:
          type: string
          description: "`Mobile`, `Email`, etc."
        numero_contacto:
          type: string
          description: "Número ou endereço, conforme o tipo."
        lingua_contacto:
          type: string
          description: "Língua preferida nas comunicações."
        # --- Dados bancários
        codigo_banco:
          type: string
          description: "Código do banco; `0008` para o BCI."
        numero_conta:
          type: string
          description: "Número da conta de débito."
        tipo_moeda:
          type: string
          description: "`MZN`."
        # --- Apólice
        tipo_seguro:
          type: string
          description: "`vida`."
        canal_venda:
          type: string
          description: "`balcao` para a venda fechada ao balcão."
        data_emissao:
          type: string
          format: date
          description: "Data de emissão do certificado."
        data_apolice:
          type: string
          format: date
          description: "Data da apólice."
        data_inicio_seguro:
          type: string
          format: date
          description: "Início da cobertura."
        papel:
          type: string
          description: "Papel do cliente no contrato, `tomador`."
        quota:
          type: number
          format: double
          description: "Percentagem do capital atribuída a este segurado."
        estado:
          type: string
          description: "Estado do contrato na origem, `activo`."
        designacao:
          type: string
          description: "Designação comercial do produto. Texto livre do canal."
        lingua_apolice:
          type: string
          description: "Língua em que a apólice é emitida."
        tipo_pagamento:
          type: string
          description: "`debito_conta`."
        num_prestacoes:
          type: integer
          description: "Número de prestações do prémio."
        man_id:
          type: string
          description: "Identificador do mandato no sistema de origem."
        tipo_segurado:
          type: string
          description: "`principal` ou segurado secundário."
        capital_seguro:
          type: number
          format: double
          description: "Capital seguro. Em regra igual a `montante_emprestimo`."
        premio_pago:
          type: number
          format: double
          description: "Prémio cobrado ao cliente. Coluna própria, guardado sem conferência - valor não numérico fica a `null`, não dá erro."
        comissao:
          type: number
          format: double
          description: "Comissão praticada. Coluna própria, mesmas regras."
        certificado_apolice:
          type: string
          format: byte
          description: "Certificado de apólice em base64. Coluna própria - é retirado de `dados` e não é descodificado nem verificado."
        # --- Questionário clínico — hábitos
        altura_cm:
          type: integer
          description: "Altura em centímetros."
        peso_kg:
          type: number
          format: double
          description: "Peso em quilogramas."
        fuma:
          type: string
          description: "Resposta do questionário: `Sim` / `Nao`."
